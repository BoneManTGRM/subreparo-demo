[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subreparo-immune"
version = "0.1.0"
description = "Adaptive repair-memory security scanner for SubReparo Immune"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Cody R. Jenkins" }
]
license = { text = "Apache-2.0" }
keywords = ["security", "reparodynamics", "immune-system", "ai-safety", "scanner"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security"
]

dependencies = []

[project.scripts]
subreparo-immune = "subreparo_immune.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
